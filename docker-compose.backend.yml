services:
  backend:
    image: ghcr.io/rakeshrkb/killer-game-backend:redis-distributed
    container_name: killer-game-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - visitor_data:/app/data
    environment:
      - REDIS_URL=redis://${REDIS_ADDR}:6379
    env_file:
      - .env
  redis:
    image: redis:7-alpine
    container_name: killer-game-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}
      --replicaof ${REDIS_PRIMARY_ADDR} 6379
      --appendonly yes

  sentinel:
    image: redis:7-alpine
    container_name: killer-game-sentinel
    restart: unless-stopped
    ports:
      - "26379:26379"
    command: >
      redis-server --port 26379 --sentinel
      --sentinel resolve-hostnames yes
      --sentinel monitor ${REDIS_MASTER_NAME} ${REDIS_PRIMARY_ADDR} 6379 2
      --sentinel auth-pass ${REDIS_MASTER_NAME} ${REDIS_PASSWORD}
      --sentinel down-after-milliseconds ${REDIS_MASTER_NAME} 5000
      --sentinel failover-timeout ${REDIS_MASTER_NAME} 10000
      --sentinel parallel-syncs ${REDIS_MASTER_NAME} 1

volumes:
  visitor_data:
  redis_data:

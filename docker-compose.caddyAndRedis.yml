services:
  redis:
    image: redis:7-alpine
    container_name: killer-game-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data

  caddy:
    image: caddy:2-alpine
    container_name: killer-game-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  redis_data:
services:
  redis:
    image: redis:7-alpine
    container_name: killer-game-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}
      --appendonly yes

  sentinel:
    image: redis:7-alpine
    container_name: killer-game-sentinel
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "26379:26379"
    volumes:
      - sentinel_data:/data
    command: >
      sh -c '
      if [ ! -s /data/sentinel.conf ]; then
      printf "port 26379\nsentinel resolve-hostnames yes\nsentinel announce-ip %s\nsentinel announce-port 26379\nsentinel monitor %s %s 6379 2\nsentinel auth-pass %s %s\nsentinel down-after-milliseconds %s 5000\nsentinel failover-timeout %s 10000\nsentinel parallel-syncs %s 1\n" "$$SENTINEL_ANNOUNCE_IP" "$$REDIS_MASTER_NAME" "$$REDIS_PRIMARY_ADDR" "$$REDIS_MASTER_NAME" "$$REDIS_PASSWORD" "$$REDIS_MASTER_NAME" "$$REDIS_MASTER_NAME" "$$REDIS_MASTER_NAME" > /data/sentinel.conf;
      fi &&
      redis-server /data/sentinel.conf --sentinel'

  caddy:
    image: caddy:2-alpine
    container_name: killer-game-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - BACKEND1_ADDR=${BACKEND1_ADDR}
      - BACKEND2_ADDR=${BACKEND2_ADDR}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  sentinel_data:
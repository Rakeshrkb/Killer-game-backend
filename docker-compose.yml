services:
  redis:
    image: redis:7-alpine
    container_name: killer-game-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
  backend:
    image: ghcr.io/rakeshrkb/killer-game-backend:latest
    volumes:
      - visitor_data:/app/data
    container_name: killer-game-backend
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  caddy:
    image: caddy:2-alpine
    container_name: killer-game-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
  visitor_data:
  redis_data:
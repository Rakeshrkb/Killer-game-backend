services:
  backend:
    build: .
    volumes:
      - visitor_data:/app/visitor-count.json
    container_name: killer-game-backend
    restart: unless-stopped
    expose:
      - "3001"

  caddy:
    image: caddy:2-alpine
    container_name: killer-game-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
  visitor_data: